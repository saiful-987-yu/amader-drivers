  <script>
    // Small inline glue that doesn't warrant its own file:
    // brand/theme icon injection + footer year.
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".brand__mark").forEach(function (n) {
        // New brand logo — falls back to the old drawn icon (never a
        // broken-image icon, never a blank box) if the file is
        // missing or fails to load, exactly like every other image
        // fallback on this site.
        var img = document.createElement("img");
        img.src = "assets/brand/logo-low.png";
        img.alt = "";
        img.style.cssText = "width:100%;height:100%;object-fit:contain;border-radius:inherit;";
        img.onerror = function () { n.innerHTML = Icons.logo; };
        n.appendChild(img);
      });
      var themeIcon = document.querySelector("[data-theme-icon]");
      function paintThemeIcon() { themeIcon.innerHTML = Theme.current() === "dark" ? Icons.sun : Icons.moon; }
      paintThemeIcon();
      document.addEventListener("nobi:themechange", paintThemeIcon);
      var menuIcon = document.getElementById("menu-toggle");
      menuIcon.innerHTML = Icons.menu;
      menuIcon.addEventListener("click", function () {
        var open = document.getElementById("mobile-nav").classList.contains("is-open");
        menuIcon.innerHTML = open ? Icons.menu : Icons.close;
      });
      var yearEl = document.querySelector("[data-year]");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Footer social links — icon + URL come from config/config.js
      // (SOCIAL_LINKS), so the owner can update just that file later.
      var socialNav = document.getElementById("footer-social");
      if (socialNav && window.NOBI_CONFIG && window.NOBI_CONFIG.SOCIAL_LINKS) {
        var platforms = [
          { key: "facebook", icon: Icons.facebook, labelKey: "footer.facebook" },
          { key: "whatsapp", icon: Icons.whatsapp, labelKey: "footer.whatsapp" },
          { key: "tiktok", icon: Icons.tiktok, labelKey: "footer.tiktok" },
          { key: "linkedin", icon: Icons.linkedin, labelKey: "footer.linkedin" }
        ];
        platforms.forEach(function (p) {
          var href = window.NOBI_CONFIG.SOCIAL_LINKS[p.key] || "#";
          // WhatsApp is configured as a plain phone number, not a URL —
          // reuse the same wa.me link builder as everywhere else on the
          // site (Utils.waLink) instead of a one-off implementation here.
          if (p.key === "whatsapp" && href !== "#") href = Utils.waLink(href);
          var a = document.createElement("a");
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";
          a.setAttribute("aria-label", Lang.t(p.labelKey));
          a.innerHTML = p.icon;
          socialNav.appendChild(a);
        });
      }
    });
  </script>
